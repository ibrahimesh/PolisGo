# Demo data on top of the normal stack: demo agents, adjusters, clients,
# policies and claims, so the dashboards have something to show.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# DEMO ACCOUNTS, NOT FOR PRODUCTION. They all share one password,
# DEMO_PASSWORD from .env (required: there is no built-in one); the API
# refuses to seed when ASPNETCORE_ENVIRONMENT is Production, and seeds only
# once per database.
services:
  api:
    environment:
      Demo__SeedData: "true"
      Demo__Password: ${DEMO_PASSWORD:?DEMO_PASSWORD is required for the demo accounts (see .env.example).}
