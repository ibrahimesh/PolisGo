<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PolisGo — motor insurance management, Azerbaijan." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PolisGo</title>
    <script>
      // Resolve the theme before first paint to avoid a dark/light flash.
      // Mirrors src/theme/theme.ts; the default is dark.
      (function () {
        var pref = 'dark';
        try {
          pref = localStorage.getItem('polisgo.theme') || 'dark';
        } catch (e) {}
        var resolved =
          pref === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : pref === 'light'
              ? 'light'
              : 'dark';
        document.documentElement.setAttribute('data-theme', resolved);
        // "Reduce motion" from Settings (src/settings/motion.ts).
        try {
          if (localStorage.getItem('polisgo.motion') === 'reduce') {
            document.documentElement.setAttribute('data-motion', 'reduce');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
