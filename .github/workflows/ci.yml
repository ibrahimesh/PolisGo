name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege default — individual jobs can widen if they need to.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PolisGo.slnx

      # dotnet list exits 0 even when it finds something, so read its output.
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list PolisGo.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

      - name: Build (Release, warnings as errors)
        run: dotnet build PolisGo.slnx --no-restore -c Release -warnaserror

      - name: Test with coverage
        run: >
          dotnet test PolisGo.slnx --no-build -c Release
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          # Cobertura stores line-rate as a 0..1 decimal on the root <coverage> node.
          # Bash in GitHub Actions sets `pipefail`, so `grep ... | head -n1` fails
          # when head closes the pipe early (SIGPIPE on grep). A single awk pass
          # avoids the pipeline entirely and also handles a missing attribute.
          report=$(find TestResults -name 'coverage.cobertura.xml' -print -quit)
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "No coverage report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          rate=$(awk 'match($0, /line-rate="[0-9.]+"/) {
            s = substr($0, RSTART, RLENGTH)
            gsub(/line-rate="|"/, "", s)
            print s
            exit
          }' "$report")
          if [ -z "$rate" ]; then
            echo "Coverage report at \`$report\` had no line-rate attribute." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          {
            echo "## Coverage"
            echo ""
            echo "- Line coverage: **${pct}%**"
            echo "- Source: \`$report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      # Unit/component tests; the Playwright suite runs in the e2e job.
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The full Playwright suite against the real stack: SQL Server and the API
  # from docker compose with the demo data override (migrations, the dev
  # admin seed and the demo accounts run on start-up; the dashboard tests
  # read the demo history),
  # the Vite dev server started by Playwright. Throwaway containers, so the
  # credentials below are CI-only values, not secrets.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.demo.yml:docker-compose.e2e.yml
      SQL_SA_PASSWORD: Ci-Only-Sql-Passw0rd!
      JWT_SECRET_KEY: ci-only-jwt-signing-key-not-a-secret-0123456789
      SEED_ADMIN_EMAIL: admin@polisgo.test
      SEED_ADMIN_PASSWORD: Ci-Only-Admin-Passw0rd
      E2E_ADMIN_EMAIL: admin@polisgo.test
      E2E_ADMIN_PASSWORD: Ci-Only-Admin-Passw0rd
      DEMO_PASSWORD: Ci-Only-Demo-Passw0rd

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Started first: SQL Server needs a minute to warm up, which overlaps
      # with the npm and browser installs below.
      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Setup Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (clean, from lockfile)
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Wait for the API to be healthy
        run: docker compose up --wait --wait-timeout 240

      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: API and SQL Server logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Tests that need SQL Server itself: locking under concurrent requests,
  # decimal rounding and the migrations' SQL. They are [SqlServerFact]s,
  # skipped in the job above; here each gets a fresh, migrated database.
  sqlserver-tests:
    name: SQL Server integration tests
    runs-on: ubuntu-latest
    env:
      SQL_SA_PASSWORD: Ci-Only-Sql-Passw0rd!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Only-Sql-Passw0rd!
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: |
          dotnet restore PolisGo.slnx
          dotnet build PolisGo.slnx --no-restore -c Release -warnaserror

      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 30); do
            if docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
                 -C -S localhost -U sa -P "$SQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not accept connections in time."
          exit 1

      - name: Test on SQL Server
        env:
          POLISGO_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False
        run: dotnet test PolisGo.slnx --no-build -c Release --filter "Category=SqlServer"

  docker-build:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build API image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: src/PolisGo.Api/Dockerfile
          push: false
          tags: polisgo-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
