# e2e runs: one address registers hundreds of users and signs in again and
# again, so the brute-force limits (RateLimits, strict by default) are relaxed.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.e2e.yml up --build
services:
  api:
    environment:
      RateLimits__SignIn__PermitLimit: "100000"
      RateLimits__Register__PermitLimit: "100000"
      RateLimits__PasswordChange__PermitLimit: "100000"
