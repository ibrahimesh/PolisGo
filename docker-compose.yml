services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: polisgo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Compose fails fast with the quoted message if SQL_SA_PASSWORD is missing.
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required in .env (8+ chars, upper+lower+digit+symbol).}
      MSSQL_PID: "Developer"
    # Loopback only: the database is for this machine's tools, not the network.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # Issues a real query so "healthy" means "accepting connections and able
      # to execute SQL" — not just "process is alive".
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -C -N -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/PolisGo.Api/Dockerfile
    container_name: polisgo-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Dev env so Swagger is served and the dev-only admin seed runs. In a
      # real production deployment this would be Production and secrets would
      # come from a managed secret store, not a .env file.
      ASPNETCORE_ENVIRONMENT: "Development"

      # The connection string uses the compose network alias `sqlserver`; the
      # key name "Default" matches what IConfiguration.GetConnectionString()
      # looks up in AddInfrastructure.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=PolisGo;User Id=sa;Password=${SQL_SA_PASSWORD:?SQL_SA_PASSWORD is required};TrustServerCertificate=True;Encrypt=False"

      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (at least 32 chars; see .env.example for how to generate).}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required.}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required.}

      # Apply EF Core migrations on boot — safe because the Program.cs retry
      # loop waits for SQL Server to finish warming up.
      Database__ApplyMigrationsOnStartup: "true"

      # Browser origins allowed to call the API (Vite dev server, alt dev port).
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:3000"
    # Loopback only: a Development API (Swagger, error details) must not be
    # reachable from the LAN.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Persist uploaded claim documents across container rebuilds.
      - claim-docs:/app/App_Data/claim-documents
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sqlserver-data:
  claim-docs:
